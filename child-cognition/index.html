<head>

  <meta name="description" content="上海师范大学学前教育学院《幼儿认知与学习》课程学习资料，按章节阅读研究案例与幼儿园教学应用。">
  <title>幼儿认知与学习｜课程学习资料</title>
  <style>
    :root {
      color-scheme: light;
      --ground: #f6f5fa;
      --paper: #fff;
      --ink: #242139;
      --muted: #584f69;
      --deep: #2d2149;
      --accent: #4e317f;
      --line: #ddd6e8;
      --light: #eee8fa;
      --on-dark: #fbf8ff;
      --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      --serif: "Songti SC", "Noto Serif CJK SC", "SimSun", Georgia, serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { font-family: var(--sans); background: var(--ground); color: var(--ink); }
    body { margin: 0; font-size: 1rem; line-height: 1.7; }
    h1, h2, h3, p, figure { margin: 0; }
    a { color: var(--accent); text-underline-offset: .22em; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .wrap { width: min(1080px, 100% - 48px); margin-inline: auto; }
    .masthead { min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: .875rem; font-weight: 630; }
    .hero {
      display: grid; grid-template-columns: minmax(0,1.48fr) minmax(0,1fr); align-items: center;
      gap: clamp(24px,4.2vw,60px); padding: clamp(26px,4.6vw,58px);
      border-radius: 4px 4px 28px 4px; background: var(--deep); color: var(--on-dark);
    }
    h1 { font: 800 clamp(2.35rem,6.1vw,4.65rem)/1.08 var(--serif); letter-spacing: -.045em; }
    .hero p { margin-top: 15px; color: #e4dbf2; max-width: 32em; }
    .hero figure { min-width: 0; }
    .hero img { display: block; width: 100%; aspect-ratio: 1.93; object-fit: contain; background: var(--paper); border-radius: 4px; }
    .hero figcaption { color: #e4dbf2; margin-top: 9px; font-size: .875rem; }
    .contents { margin-block: clamp(25px,4vw,48px); }
    .contents h2 { font: 760 clamp(1.5rem,3vw,2rem)/1.28 var(--serif); color: var(--deep); margin-bottom: 13px; }
    .entry { display: grid; grid-template-columns: 7.2rem minmax(0,1fr); gap: 7px 17px; padding: 19px 23px; background: var(--paper); border-top: 1px solid var(--line); }
    .entry:last-child { border-bottom: 1px solid var(--line); }
    .chapter { color: var(--muted); font-size: .9375rem; font-weight: 690; white-space: nowrap; padding-top: 4px; }
    .entry h3 { color: var(--deep); font-size: 1.13rem; line-height: 1.42; }
    .entry a:hover { text-decoration-thickness: .15em; }
    .entry p { color: var(--muted); margin-top: 5px; }
    @media (max-width: 630px) {
      .wrap { width: calc(100% - 28px); }
      .masthead { min-height: 50px; }
      .hero { grid-template-columns: minmax(0,1fr); gap: 15px; padding: 23px 17px; }
      .hero img { max-height: 165px; }
      .entry { grid-template-columns: minmax(0,1fr); padding: 14px 15px; }
      .chapter { padding: 0; }
    }
  </style>
</head>

      <article class="entry">
        <p class="chapter">第一章</p>
        <div>
          <h3><a href="chapters/01-learning-cognition-and-brain.html">学习、认知与大脑</a></h3>
          <p>从幼儿学习的表现和认知测量入手，理解脑的发展、经验与记忆。</p>

      <article class="entry">
        <p class="chapter">第二章</p>
        <div>
          <h3><a href="../learning-theories.html">三种学习观</a></h3>
          <p>从一次幼儿搭桥活动出发，比较行为主义、建构主义与情境主义怎样解释学习。</p>
        </div>
      </article>
      <article class="entry">
        <p class="chapter">第三章</p>
        <div>
          <h3><a href="chapters/03-representation-and-symbols.html">表征与符号</a></h3>
          <p>从图片和房间模型出发，理解幼儿怎样使用符号，并把图像中的信息用到现实中。</p>
        </div>
      </article>
      <article class="entry">
        <p class="chapter">第四章</p>
        <div>
          <h3><a href="chapters/04-classification-and-concepts.html">分类与概念</a></h3>
          <p>从同一组材料的分法和鲨鱼呼吸实验，理解幼儿怎样使用类别知识，并联系幼儿园的提问与观察。</p>
